<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: black;
    overflow: hidden;
}

#player {
    width: 100vw;
    height: 100vh;
    position: relative;
    cursor: pointer;
}

#thumbnail {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    z-index: 2;
}

#video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    z-index: 1;
}
</style>
</head>

<body>

<div id="player">

    <!-- SADECE SENİN GÖRSELİN -->
    <img id="thumbnail" src="thumbnail.jpg">

    <!-- CATBOX VİDEOSU -->
    <video id="video" loop playsinline preload="auto">
        <source src="https://files.catbox.moe/vh7mrp.mp4" type="video/mp4">
    </video>

</div>

<script>

const player = document.getElementById("player");
const video = document.getElementById("video");
const thumbnail = document.getElementById("thumbnail");

player.addEventListener("click", async () => {

    thumbnail.remove();

    video.muted = false;

    try {
        await video.play();
    } catch (error) {
        console.log(error);
    }

}, { once: true });

</script>

</body>
</html>
