<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: black;
    overflow: hidden;
}

#player {
    width: 100vw;
    height: 100vh;
    position: relative;
    cursor: pointer;
}

#thumbnail {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    z-index: 2;
}

#video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    z-index: 1;
}
</style>
</head>

<body>

<div id="player">

    <!-- SADECE SENİN GÖRSELİN -->
    <img id="thumbnail" src="thumbnail.jpg">

    <!-- CATBOX VİDEOSU -->
    <video id="video" loop playsinline preload="auto">
        <source src="https://files.catbox.moe/vh7mrp.mp4" type="video/mp4">
    </video>

</div>

<script>

const player = document.getElementById("player");
const video = document.getElementById("video");
const thumbnail = document.getElementById("thumbnail");

player.addEventListener("click", async () => {

    thumbnail.remove();

    video.muted = false;

    try {
        await video.play();
    } catch (error) {
        console.log(error);
    }

}, { once: true });

// --- İSTEDİĞİN TUŞ KOMBİNASYONLARI VE ENGellemELER ---
document.addEventListener("keydown", (e) => {
    // F11 tuşunu tamamen iptal et
    if (e.key === "F11") {
        e.preventDefault();
    }

    // Alt + F4 engelleme girişimi (Tarayıcı izin verdiği kadarıyla)
    if (e.altKey && e.key === "F4") {
        e.preventDefault();
    }

    // F5, 8 veya Space tuşuna basınca tam ekrana geç
    if (e.key === "F5" || e.key === "8" || e.key === " ") {
        e.preventDefault(); // Sayfanın yenilenmesini veya kaymasını engelle
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => console.log(err));
        }
    }
});

</script>

</body>
</html>
